<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print counter - Focus Digital Color Lab</title>
<link rel="icon" href="/drop/assets/favicon.ico">
<link rel="stylesheet" href="/drop/assets/app.css">
<style>
  .top, .wrap { max-width: 760px; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); }
  .ic { width: 22px; height: 22px; flex: none; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 44px; height: 44px; padding: 0;
    border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer;
    transition: background-color .15s, color .15s, transform .12s ease-out;
  }
  .icon-btn:hover { background: var(--line); color: var(--text); }
  .icon-btn:active { transform: scale(0.96); }
  .icon-btn.on { background: var(--btn); color: var(--btn-ink); }
  .icon-btn.on:hover { background: var(--btn-hi); }
  .conn { font-size: .85rem; color: var(--muted); margin-right: 4px; }
  .conn::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--ok); }
  .conn:empty::before { display: none; }
  .conn.bad { color: var(--err); font-weight: 600; }
  .conn.bad::before { background: var(--err); }

  .link { display: grid; gap: 2px; padding: 8px 0 4px; font-size: .9rem; color: var(--muted); }
  .link code { font: 500 .95rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text); word-break: break-all; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 0 8px; }
  h2 { font-size: 1.5rem; }
  .head span { font-size: .9rem; color: var(--muted); }

  .list { list-style: none; margin: 0; padding: 0; }
  .item {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center;
    padding: 14px 12px; margin: 0 -12px; border-bottom: 1px solid var(--line); border-radius: var(--r-sm);
    transition: background-color 1.2s ease-out;
  }
  .item:last-child { border-bottom-color: transparent; }
  .item.fresh { background: color-mix(in srgb, var(--bar) 16%, transparent); transition: none; }
  .meta { min-width: 0; }
  .who { font-weight: 700; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .what { font-size: .88rem; color: var(--muted); }
  .more { display: block; margin: 16px auto 0; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: var(--r); }

  dialog {
    width: min(480px, calc(100% - 32px)); padding: 24px; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--surface); color: var(--text);
  }
  dialog::backdrop { background: rgb(5 15 25 / .55); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .dlg-head h2 { font-size: 1.25rem; }
  .sec { display: grid; gap: 10px; padding: 16px 0; border-top: 1px solid var(--line); }
  .sec:first-of-type { border-top: 0; }
  .sec h3 { margin: 0; font-size: .95rem; }
  .sec input {
    min-height: 48px; padding: 0 14px; font: inherit; color: var(--text); background: var(--bg);
    border: 1.5px solid var(--field); border-radius: var(--r);
  }
  .sec input:disabled { opacity: .7; cursor: not-allowed; border-color: var(--line); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .btn-primary { background: var(--btn); color: var(--btn-ink); border: 0; }
</style>
</head>
<body>
<header class="top">
  <img src="/drop/assets/logo-192x192.png" width="40" height="40" alt="">
  <b>Print counter</b>
  <span class="grow"></span>
  <span id="conn" class="conn" aria-live="polite"></span>
  <button id="sound" class="icon-btn" type="button" aria-pressed="false" title="Sound off" aria-label="Sound off">
    <span id="sndOn" hidden><svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M157.27,21.22a12,12,0,0,0-12.64,1.31L75.88,76H32A20,20,0,0,0,12,96v64a20,20,0,0,0,20,20H75.88l68.75,53.47A12,12,0,0,0,164,224V32A12,12,0,0,0,157.27,21.22ZM36,100H68v56H36Zm104,99.46L92,162.13V93.87l48-37.33ZM212,128a44,44,0,0,1-11,29.11,12,12,0,1,1-18-15.88,20,20,0,0,0,0-26.43,12,12,0,0,1,18-15.86A43.94,43.94,0,0,1,212,128Zm40,0a83.87,83.87,0,0,1-21.39,56,12,12,0,0,1-17.89-16,60,60,0,0,0,0-80,12,12,0,1,1,17.88-16A83.87,83.87,0,0,1,252,128Z"/></svg></span><span id="sndOff"><svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M56.88,31.93A12,12,0,1,0,39.12,48.07L64.51,76H32A20,20,0,0,0,12,96v64a20,20,0,0,0,20,20H75.88l68.75,53.47A12,12,0,0,0,164,224V185.44l35.12,38.63a12,12,0,0,0,17.76-16.14ZM36,100H68v56H36Zm104,99.46L92,162.13V106.24L140,159Zm-31-134a12,12,0,0,1,2.11-16.84l33.51-26.07A12,12,0,0,1,164,32V94.94a12,12,0,0,1-24,0V56.54l-14.15,11A12,12,0,0,1,109,65.44Zm74,49.35a12,12,0,0,1,18-15.85,44,44,0,0,1,5.55,50.21,12,12,0,0,1-21-11.55A19.67,19.67,0,0,0,188,128,20,20,0,0,0,183,114.79ZM252,128a84.18,84.18,0,0,1-19.11,53.35,12,12,0,1,1-18.53-15.25A60,60,0,0,0,212.73,88a12,12,0,1,1,17.88-16A83.87,83.87,0,0,1,252,128Z"/></svg></span>
  </button>
  <button id="settingsBtn" class="icon-btn" type="button" title="Settings" aria-label="Settings"><svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M128,76a52,52,0,1,0,52,52A52.06,52.06,0,0,0,128,76Zm0,80a28,28,0,1,1,28-28A28,28,0,0,1,128,156Zm92-27.21v-1.58l14-17.51a12,12,0,0,0,2.23-10.59A111.75,111.75,0,0,0,225,71.89,12,12,0,0,0,215.89,66L193.61,63.5l-1.11-1.11L190,40.1A12,12,0,0,0,184.11,31a111.67,111.67,0,0,0-27.23-11.27A12,12,0,0,0,146.3,22L128.79,36h-1.58L109.7,22a12,12,0,0,0-10.59-2.23A111.75,111.75,0,0,0,71.89,31.05,12,12,0,0,0,66,40.11L63.5,62.39,62.39,63.5,40.1,66A12,12,0,0,0,31,71.89,111.67,111.67,0,0,0,19.77,99.12,12,12,0,0,0,22,109.7l14,17.51v1.58L22,146.3a12,12,0,0,0-2.23,10.59,111.75,111.75,0,0,0,11.29,27.22A12,12,0,0,0,40.11,190l22.28,2.48,1.11,1.11L66,215.9A12,12,0,0,0,71.89,225a111.67,111.67,0,0,0,27.23,11.27A12,12,0,0,0,109.7,234l17.51-14h1.58l17.51,14a12,12,0,0,0,10.59,2.23A111.75,111.75,0,0,0,184.11,225a12,12,0,0,0,5.91-9.06l2.48-22.28,1.11-1.11L215.9,190a12,12,0,0,0,9.06-5.91,111.67,111.67,0,0,0,11.27-27.23A12,12,0,0,0,234,146.3Zm-24.12-4.89a70.1,70.1,0,0,1,0,8.2,12,12,0,0,0,2.61,8.22l12.84,16.05A86.47,86.47,0,0,1,207,166.86l-20.43,2.27a12,12,0,0,0-7.65,4,69,69,0,0,1-5.8,5.8,12,12,0,0,0-4,7.65L166.86,207a86.47,86.47,0,0,1-10.49,4.35l-16.05-12.85a12,12,0,0,0-7.5-2.62c-.24,0-.48,0-.72,0a70.1,70.1,0,0,1-8.2,0,12.06,12.06,0,0,0-8.22,2.6L99.63,211.33A86.47,86.47,0,0,1,89.14,207l-2.27-20.43a12,12,0,0,0-4-7.65,69,69,0,0,1-5.8-5.8,12,12,0,0,0-7.65-4L49,166.86a86.47,86.47,0,0,1-4.35-10.49l12.84-16.05a12,12,0,0,0,2.61-8.22,70.1,70.1,0,0,1,0-8.2,12,12,0,0,0-2.61-8.22L44.67,99.63A86.47,86.47,0,0,1,49,89.14l20.43-2.27a12,12,0,0,0,7.65-4,69,69,0,0,1,5.8-5.8,12,12,0,0,0,4-7.65L89.14,49a86.47,86.47,0,0,1,10.49-4.35l16.05,12.85a12.06,12.06,0,0,0,8.22,2.6,70.1,70.1,0,0,1,8.2,0,12,12,0,0,0,8.22-2.6l16.05-12.85A86.47,86.47,0,0,1,166.86,49l2.27,20.43a12,12,0,0,0,4,7.65,69,69,0,0,1,5.8,5.8,12,12,0,0,0,7.65,4L207,89.14a86.47,86.47,0,0,1,4.35,10.49l-12.84,16.05A12,12,0,0,0,195.88,123.9Z"/></svg></button>
</header>

<main class="wrap">
  <div class="link"><span>Customer link</span><code id="urls"></code></div>

  <div class="head"><h2>Today</h2><span id="count"></span></div>
  <ul id="list" class="list"></ul>
  <button id="more" class="btn btn-ghost btn-small more" type="button" hidden></button>
  <p id="empty" class="empty" hidden>No photos yet today. New uploads appear here as customers send them.</p>
</main>

<dialog id="settings" aria-labelledby="settingsTitle">
  <div class="dlg-head">
    <h2 id="settingsTitle">Settings</h2>
    <button id="settingsClose" class="icon-btn" type="button" aria-label="Close"><svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z"/></svg></button>
  </div>

  <form id="reviewForm" class="sec">
    <h3><label for="review">Google review link</label></h3>
    <span class="hint">Shown to customers after they send photos. Leave empty to hide it.</span>
    <input id="review" type="url" maxlength="500" placeholder="https://g.page/r/.../review" disabled>
    <div class="row">
      <button id="reviewEdit" class="btn btn-ghost btn-small" type="button">Edit</button>
      <button id="reviewSave" class="btn btn-primary btn-small" type="submit" hidden>Save</button>
      <button id="reviewCancel" class="btn btn-ghost btn-small" type="button" hidden>Cancel</button>
      <span id="reviewMsg" class="conn" aria-live="polite"></span>
    </div>
  </form>

  <div class="sec">
    <h3>Saving to</h3>
    <code id="dir" class="hint" style="word-break:break-all"></code>
  </div>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
  const hhmm = (d) => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  const PAGE = 50;
  let shown = PAGE;
  const rows = new Map(); // folder -> {files, bytes, at, li}
  let audio = null, soundOn = false, lastBeep = 0, savedReview = '';
  try { soundOn = localStorage.getItem('fl_sound') === '1'; } catch (_) {}

  function label(folder) {
    const base = folder.split('/').pop();
    return base.replace(/_\d{4}(-\d+)?$/, '').replace(/_/g, ' ');
  }
  function started(folder) {
    const m = folder.match(/_(\d{2})(\d{2})(-\d+)?$/);
    return m ? m[1] + ':' + m[2] : '';
  }

  function draw(r, folder) {
    if (!r.li) {
      r.li = document.createElement('li');
      r.li.className = 'item';
      r.li.innerHTML = '<div class="meta"><div class="who"></div><div class="what"></div></div>';
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-ghost btn-small';
      b.textContent = 'Open folder';
      b.onclick = () => fetch('/lab-counter/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folder }) });
      r.li.append(b);
    }
    r.li.querySelector('.who').textContent = label(folder);
    r.li.querySelector('.what').textContent =
      r.files + (r.files === 1 ? ' file, ' : ' files, ') + fmt(r.bytes) + ', last at ' + hhmm(r.at) +
      (started(folder) ? ', started ' + started(folder) : '');
  }

  function render() {
    const sorted = [...rows.entries()].sort((a, b) => new Date(b[1].at) - new Date(a[1].at));
    $('list').replaceChildren(...sorted.slice(0, shown).map(([f, r]) => r.li));
    const left = sorted.length - shown;
    $('more').hidden = left <= 0;
    $('more').textContent = 'Show more (' + left + ' older)';
    $('empty').hidden = rows.size > 0;
    $('count').textContent = rows.size ? rows.size + (rows.size === 1 ? ' customer' : ' customers') : '';
  }

  async function load() {
    const res = await fetch('/lab-counter/api/info');
    if (res.status === 401) { location.href = '/lab-counter/login'; return; }
    const d = await res.json();
    $('dir').textContent = d.dir;
    savedReview = d.review || '';
    $('review').value = savedReview;
    $('urls').textContent = d.urls.length ? d.urls.join('   ') : 'Not connected to a network';
    for (const s of d.sessions) {
      const r = rows.get(s.folder) || {};
      Object.assign(r, { files: s.files, bytes: s.bytes, at: s.at });
      rows.set(s.folder, r);
      draw(r, s.folder);
    }
    render();
  }

  // The review link is a one-time setup, so the field stays locked until Edit is pressed.
  function lockReview(locked) {
    $('review').disabled = locked;
    $('reviewEdit').hidden = !locked;
    $('reviewSave').hidden = locked;
    $('reviewCancel').hidden = locked;
    if (!locked) $('review').focus();
  }
  $('reviewEdit').onclick = () => { $('reviewMsg').textContent = ''; lockReview(false); };
  $('reviewCancel').onclick = () => { $('review').value = savedReview; $('reviewMsg').textContent = ''; lockReview(true); };
  $('reviewForm').onsubmit = async (e) => {
    e.preventDefault();
    const res = await fetch('/lab-counter/review', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: $('review').value }) });
    $('reviewMsg').classList.toggle('bad', !res.ok);
    if (!res.ok) { $('reviewMsg').textContent = (await res.text()).trim(); return; }
    savedReview = $('review').value.trim();
    $('review').value = savedReview;
    $('reviewMsg').textContent = 'Saved';
    lockReview(true);
  };
  $('settingsBtn').onclick = () => $('settings').showModal();
  $('settingsClose').onclick = () => $('settings').close();
  $('settings').addEventListener('click', (e) => { if (e.target === $('settings')) $('settings').close(); });
  $('settings').addEventListener('close', () => { $('review').value = savedReview; $('reviewMsg').textContent = ''; lockReview(true); });

  function beep() {
    const now = Date.now();
    if (!soundOn || !audio || now - lastBeep < 3000) return;
    lastBeep = now;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.2, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.35);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + 0.35);
  }

  function live() {
    const es = new EventSource('/lab-counter/events');
    es.onopen = () => { $('conn').textContent = 'Live'; $('conn').className = 'conn'; load(); };
    es.onerror = () => { $('conn').textContent = 'Reconnecting'; $('conn').className = 'conn bad'; };
    es.onmessage = (m) => {
      const e = JSON.parse(m.data);
      const r = rows.get(e.folder) || { files: 0, bytes: 0 };
      r.files++; r.bytes += e.size; r.at = e.at;
      rows.set(e.folder, r);
      draw(r, e.folder);
      render();
      r.li.classList.add('fresh');
      setTimeout(() => r.li.classList.remove('fresh'), 4000);
      beep();
    };
  }

  $('more').onclick = () => { shown += PAGE; render(); };

  function paintSound() {
    $('sound').classList.toggle('on', soundOn);
    $('sound').title = soundOn ? 'Sound on' : 'Sound off';
    $('sound').setAttribute('aria-label', $('sound').title);
    $('sndOn').hidden = !soundOn;
    $('sndOff').hidden = soundOn;
    $('sound').setAttribute('aria-pressed', soundOn);
  }
  $('sound').onclick = () => {
    soundOn = !soundOn;
    if (soundOn && !audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (soundOn && audio.state === 'suspended') audio.resume();
    try { localStorage.setItem('fl_sound', soundOn ? '1' : '0'); } catch (_) {}
    paintSound();
    if (soundOn) { lastBeep = 0; beep(); }
  };
  // Browsers only allow audio after a click, so a saved "on" stays silent until the first click anywhere.
  document.addEventListener('click', () => {
    if (soundOn && !audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  }, { once: true });

  paintSound();
  load();
  live();
})();
</script>
</body>
</html>
