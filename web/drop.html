<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#EAF5FC"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0B1B2B"
      media="(prefers-color-scheme: dark)"
    />
    <title>Focus Digital Color Lab</title>
    <link rel="icon" href="/drop/assets/favicon.ico" />
    <link
      rel="preload"
      href="/drop/assets/fonts/Kalpurush.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Kalpurush";
        src: url("/drop/assets/fonts/Kalpurush.ttf") format("truetype");
        font-display: swap;
        /* Bengali letters, digits and danda only; Latin text (file names, KB, PDF) keeps the system font */
        unicode-range: U+0980-09FF, U+0964-0965, U+200C-200D;
      }

      /* One theme per visitor (device setting). Soft sky blue for buttons and progress. */
      :root {
        --bg: #f2f8fc;
        --surface: #fbfdff;
        --text: #0d2236;
        --muted: #46607a;
        --line: #d6e6f2;
        --edge: #8fc3e4;
        --field: #7595b3;
        --sky-tint: #e6f3fb;
        --btn: #bfe1f6;
        --btn-hi: #a6d5f1;
        --btn-ink: #0b2a40;
        --glow: rgba(70, 150, 205, 0.45);
        --bar: #4ba7db;
        --track: #d9ecf8;
        --link: #1d6fa6;
        --focus: #1d6fa6;
        --err: #b42318;
        --ok: #17744f;
        --r: 14px;
        --r-sm: 10px;
        --font-latin:
          "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui,
          -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
        --font: var(--font-latin);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1b2b;
          --surface: #11273b;
          --text: #eaf3fa;
          --muted: #a9bccd;
          --line: #223d56;
          --edge: #4f7fa3;
          --field: #6e93b3;
          --sky-tint: #0f2539;
          --btn: #7cc3ec;
          --btn-hi: #98d0f2;
          --btn-ink: #07203a;
          --glow: rgba(124, 195, 236, 0.28);
          --bar: #7cc3ec;
          --track: #21405a;
          --link: #8ccbf0;
          --focus: #9ad3f5;
          --err: #ff9c94;
          --ok: #6fd3a0;
        }
      }
      html[lang="bn"] {
        --font: "Kalpurush", var(--font-latin);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font: 400 1rem/1.55 var(--font);
      }
      /* the Bangla font has a single weight, so no fake bold; emphasis comes from size and colour */
      html[lang="bn"] {
        font-synthesis: none;
      }
      html[lang="bn"] body {
        font-size: 1.12rem;
      }
      html[lang="bn"] .hint,
      html[lang="bn"] .sub,
      html[lang="bn"] .overall p,
      html[lang="bn"] .skipped {
        font-size: 1rem;
      }
      html[lang="bn"] .btn {
        font-size: 1.1rem;
      }
      html[lang="bn"] .brand span {
        font-size: 1.05rem;
      }
      html[lang="bn"] .field label {
        font-size: 1.05rem;
      }
      /* Latin words inside Bangla text (like "Optional") must not look bolder than the Bangla around them */
      html[lang="bn"] .brand span,
      html[lang="bn"] .field label,
      html[lang="bn"] h1,
      html[lang="bn"] h2,
      html[lang="bn"] .btn {
        font-weight: 400;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      .ic {
        width: 1.4em;
        height: 1.4em;
        fill: currentColor;
        flex: none;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .rise {
        animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: calc(var(--i, 0) * 70ms);
      }

      /* header */
      .top {
        max-width: 640px;
        margin: 0 auto;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 64px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
      }
      .brand img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        flex: none;
      }
      .brand span {
        font-weight: 700;
        font-size: 0.95rem;
        line-height: 1.25;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .icon-btn {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: var(--r-sm);
        background: transparent;
        text-decoration: none;
        transition: transform 0.12s;
      }
      .icon-btn:hover {
        transform: scale(1.06);
      }
      .icon-btn:active {
        transform: scale(0.94);
      }
      .icon-btn .ic {
        width: 34px;
        height: 34px;
      }
      /* One button that names the language you would switch to. Kalpurush only draws the Bengali letters. */
      .lang-btn {
        width: 88px; /* fixed, so the button does not move when its label changes */
        min-height: 44px;
        padding: 0;
        border: 0;
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--link);
        font:
          500 1rem "Kalpurush",
          var(--font-latin);
        font-synthesis: none;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 0.15s,
          transform 0.12s;
      }
      /* Kalpurush draws smaller than the Latin font at the same size, so give the Bangla label more size */
      .lang-btn:lang(bn) {
        font-size: 1.25rem;
      }
      .lang-btn:hover {
        background: var(--sky-tint);
      }
      .lang-btn:active {
        transform: scale(0.97);
      }

      .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 0 16px 24px;
      }

      /* intro */
      .hero-wrap {
        margin-top: 24px;
      }
      .hero {
        display: block;
        width: 100%;
        height: auto;
        border-radius: var(--r);
        border: 1px solid var(--line);
        box-shadow: 0 14px 30px -20px var(--glow);
      }
      h1 {
        margin-top: 14px;
        font-size: clamp(1.6rem, 6.4vw, 2rem);
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      html[lang="bn"] h1 {
        letter-spacing: 0;
      }
      .lede {
        margin-top: 8px;
        color: var(--muted);
        max-width: 52ch;
      }

      /* buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 52px;
        padding: 0 22px;
        border-radius: var(--r);
        border: 1.5px solid transparent;
        font: 600 1rem var(--font);
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 0.15s,
          transform 0.12s,
          box-shadow 0.2s;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
      .btn-primary {
        background: var(--btn);
        color: var(--btn-ink);
        border-color: var(--edge);
        box-shadow: 0 10px 22px -12px var(--glow);
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--btn-hi);
      }
      .btn-ghost {
        background: transparent;
        color: var(--text);
        border-color: var(--edge);
      }
      .btn-ghost:hover:not(:disabled) {
        background: var(--sky-tint);
      }
      .btn-big {
        width: 100%;
        min-height: 64px;
        font-size: 1.15rem;
      }
      .btn-small {
        min-height: 44px;
        padding: 0 14px;
        font-size: 0.9rem;
      }

      /* upload zone */
      .zone {
        margin-top: 18px;
        padding: 22px 20px;
        text-align: center;
        background: var(--sky-tint);
        border: 1.5px dashed var(--edge);
        border-radius: var(--r);
        display: grid;
        justify-items: center;
        gap: 12px;
      }
      .zone .ic {
        width: 56px;
        height: 56px;
        color: var(--link);
      }
      .zone .hint {
        max-width: 36ch;
      }
      .hint {
        font-size: 0.88rem;
        color: var(--muted);
      }

      .alert {
        margin-top: 20px;
        padding: 14px 16px;
        border-radius: var(--r);
        border: 1.5px solid var(--err);
        color: var(--err);
        font-weight: 600;
      }

      /* queue */
      .files {
        list-style: none;
        margin: 18px 0 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }
      .file {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        animation: rise 0.35s ease-out both;
      }
      .thumb {
        width: 56px;
        height: 56px;
        border-radius: var(--r-sm);
        overflow: hidden;
        background: var(--track);
        display: grid;
        place-items: center;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .meta {
        min-width: 0;
        display: grid;
        gap: 6px;
      }
      .name {
        font-weight: 600;
        font-size: 0.95rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sub {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .file[data-state="error"] .status {
        color: var(--err);
        font-weight: 600;
      }
      .file[data-state="done"] .status {
        color: var(--ok);
        font-weight: 600;
      }
      .skipped {
        margin-top: 12px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .bar {
        height: 7px;
        background: var(--track);
        border-radius: 99px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--bar);
        transform-origin: left;
        transform: scaleX(var(--p, 0));
        transition: transform 0.2s ease-out;
      }

      .fields {
        margin-top: 18px;
      }
      .two {
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr;
      }
      @media (min-width: 440px) {
        .two {
          grid-template-columns: 1fr 1fr;
        }
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field label {
        font-weight: 600;
        font-size: 0.9rem;
      }
      .field input {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        background: var(--bg);
        color: var(--text);
        border: 1.5px solid var(--field);
        border-radius: var(--r);
        font: 400 1rem var(--font);
      }
      .field input::placeholder {
        color: var(--muted);
        opacity: 1;
      }

      .actions {
        position: sticky;
        bottom: 0;
        z-index: 2;
        display: grid;
        gap: 12px;
        margin-top: 16px;
        padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
        background: var(--bg);
      }
      .overall {
        display: grid;
        gap: 8px;
      }
      .overall p {
        font-size: 0.9rem;
        color: var(--muted);
      }
      .row2 {
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr auto;
      }

      /* done */
      .done {
        margin-top: 28px;
        display: grid;
        gap: 14px;
        justify-items: start;
      }
      .tick {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--bar);
        color: var(--btn-ink);
        display: grid;
        place-items: center;
      }
      .tick .ic {
        width: 34px;
        height: 34px;
      }
      .done h2 {
        font-size: 1.5rem;
        line-height: 1.25;
      }

      /* footer */
      footer {
        max-width: 640px;
        margin: 8px auto 0;
        padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 22px;
      }
      .links a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        color: var(--link);
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .links .ic {
        width: 22px;
        height: 22px;
      }

      .review {
        display: grid;
        justify-items: center;
        text-align: center;
        gap: 8px;
        color: var(--text);
        text-decoration: none;
      }
      .review strong {
        font-size: 1.05rem;
        line-height: 1.5rem;
        text-wrap: balance;
      }
      .stars {
        display: flex;
        gap: 2px;
      }
      .stars .ic {
        width: 22px;
        height: 22px;
      }
      .review-cta {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 18px;
        border-radius: var(--r);
        background: var(--btn);
        color: var(--btn-ink);
        font-weight: 600;
      }
      .review-cta .ic {
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        padding: 2px;
      }
      .services {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .services li {
        padding: 4px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.4rem;
      }

      /* Same line heights in both languages (set in rem, not as a ratio of the font size),
         so the page does not shift up or down when the language changes. Keep this block last. */
      body {
        line-height: 1.7rem;
      }
      h1 {
        line-height: 2.3rem;
      }
      .brand span {
        line-height: 1.35rem;
      }
      .field label {
        line-height: 1.5rem;
      }
      .hint,
      .skipped,
      .overall p {
        line-height: 1.4rem;
      }
      .sub {
        line-height: 1.3rem;
      }
      footer .hint {
        max-width: 46ch;
      }
    </style>
  </head>
  <body>

    <header class="top">
      <div class="brand">
        <img
          src="/drop/assets/logo-192x192.png"
          width="40"
          height="40"
          alt=""
        />
        <span data-i18n="brand"></span>
      </div>
      <div class="tools">
        <button id="langBtn" class="lang-btn" type="button"></button>
        <a
          class="icon-btn"
          href="https://www.facebook.com/FocusDigitalColorLab"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n-aria="facebook"
        >
          <svg class="ic"><use href="#i-fb" /></svg>
        </a>
      </div>
    </header>

    <main class="wrap">
      <div id="intro">
        <h1 class="rise" style="--i: 0" data-i18n="title"></h1>
        <p class="lede rise" style="--i: 1" data-i18n="lede"></p>
      </div>

      <section id="details" class="fields rise" style="--i: 2">
        <div class="two">
          <div class="field">
            <label for="name" data-i18n="nameLabel"></label>
            <input
              id="name"
              name="name"
              autocomplete="name"
              maxlength="40"
              data-i18n-ph="nameEg"
            />
            <span class="hint" data-i18n="nameHint"></span>
          </div>
          <div class="field">
            <label for="phone" data-i18n="phoneLabel"></label>
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              maxlength="20"
              data-i18n-ph="phoneEg"
            />
            <span class="hint" data-i18n="phoneHint"></span>
          </div>
        </div>
      </section>

      <section id="pick" class="zone rise" style="--i: 3">
        <svg class="ic" aria-hidden="true"><use href="#i-up" /></svg>
        <button
          id="choose"
          class="btn btn-primary btn-big"
          type="button"
          data-i18n="choose"
        ></button>
        <p class="hint" data-i18n="zoneHint"></p>
        <p class="hint" data-i18n="limitHint"></p>
      </section>

      <div id="heroWrap" class="hero-wrap rise" style="--i: 4">
        <img
          class="hero"
          src="/drop/assets/hero.webp"
          width="1600"
          height="883"
          data-i18n-alt="heroAlt"
          alt=""
        />
      </div>

      <input
        id="file"
        type="file"
        multiple
        accept="image/*,.heic,.heif,.pdf,application/pdf"
        hidden
      />

      <p id="alert" class="alert" role="alert" hidden></p>

      <section id="queue" hidden>
        <ul id="list" class="files"></ul>
        <p id="skipped" class="skipped" hidden></p>

        <div class="actions">
          <div class="overall">
            <div
              id="overallBar"
              class="bar"
              role="progressbar"
              data-i18n-aria="progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >

    <script>
      (() => {
        const MAX = 50 * 1024 * 1024;
        const OK = /\.(jpe?g|png|heic|heif|webp|tiff?|pdf)$/i;
        const $ = (id) => document.getElementById(id);

        // ---- text (Bangla is the default) ----
        const T = {
          bn: {
            brand: "ফোকাস ডিজিটাল কালার ল্যাব",
            facebook: "ফেসবুক পেজ",
            facebookName: "ফেসবুক",
            switchTo: "English",
            heroAlt:
              "ফোকাস ডিজিটাল কালার ল্যাব, প্রিমিয়াম ফটো স্টুডিও ও ল্যাব",
            title: "প্রিন্টের জন্য আপনার ছবি পাঠান",
            lede: "গ্যালারি বা ফাইল থেকে ছবি বেছে নিন। ছবিগুলো পূর্ণ মান বজায় রেখে সরাসরি আমাদের প্রিন্ট ডেস্কে পৌঁছাবে।",
            choose: "ছবি বেছে নিন",
            zoneHint: "একসাথে অনেক ছবি বেছে নিতে পারবেন।",
            limitHint: "প্রতিটি ফাইল সর্বোচ্চ ৫০ এমবি, মোট সর্বোচ্চ ২ জিবি।",
            nameLabel: "আপনার নাম (Optional)",
            nameHint: "অর্ডার খুঁজে পেতে আমাদের সুবিধা হবে।",
            nameEg: "যেমন: তাসনিম",
            phoneLabel: "ফোন নম্বর (Optional)",
            phoneHint: "প্রয়োজনে আমরা কল করব।",
            phoneEg: "যেমন: 01713 XXXXXX",
            send0: "ছবি পাঠান",
            sendN: "{n}টি ছবি পাঠান",
            sendRest: "বাকিগুলো পাঠান",
            sending: "পাঠানো হচ্ছে...",
            add: "আরও ছবি",
            remove: "বাদ দিন",
            retry: "আবার চেষ্টা",
            ready: "প্রস্তুত",
            sendingPct: "পাঠানো হচ্ছে {p}%",
            saving: "সংরক্ষণ হচ্ছে",
            sent: "পাঠানো হয়েছে",
            overallReady: "{n}টি ফাইল প্রস্তুত, {size}",
            overallProg: "{done}/{total}টি পাঠানো হয়েছে ({p}%)",
            progress: "আপলোডের অগ্রগতি",
            skipped: "{n}টি ফাইল বাদ গেছে। শুধু ছবি ও PDF পাঠানো যায়।",
            doneTitle: "{n}টি ছবি পাওয়া গেছে",
            doneLede:
              "আমাদের টিম এগুলো প্রিন্ট করবে। এখন এই পেজ বন্ধ করতে পারেন।",
            more: "আরও ছবি পাঠান",
            review: "গুগলে রিভিউ দিন",
            reviewTitle: "আপনার সন্তুষ্টিই আমাদের সাফল্য—একটি রিভিউ দিয়ে পাশে থাকুন",
            services: ["পাসপোর্ট ছবি", "ভিসা ছবি", "ছবি রিপ্রিন্ট", "ফটো অ্যালবাম", "ফটো ফ্রেম", "মগ প্রিন্ট"],
            e401: "আপনার ১ ঘণ্টার সেশন শেষ। পেজটি রিলোড করে আবার শুরু করুন।",
            e413: "ফাইলটি ৫০ MB-এর চেয়ে বড়।",
            e415: "শুধু ছবি ও PDF ফাইল পাঠানো যায়।",
            e507: "কাউন্টারের কম্পিউটারে জায়গা নেই। দয়া করে স্টাফকে জানান।",
            eGeneric: "পাঠানো যায়নি। আবার চেষ্টা করুন।",
            eConn: "সংযোগ বিচ্ছিন্ন হয়েছে। আবার চেষ্টা করুন।",
            eStart:
              "কাউন্টারের কম্পিউটারে পৌঁছানো যাচ্ছে না। আপনি দোকানের Wi-Fi-তে আছেন কিনা দেখুন।",
          },
          en: {
            brand: "Focus Digital Color Lab",
            facebook: "Facebook page",
            facebookName: "Facebook",
            switchTo: "বাংলা",
            heroAlt: "Focus Digital Color Lab, premium photo studio and lab",
            title: "Send your photos for printing",
            lede: "Choose photos from your gallery or files. They reach our print desk at full quality.",
            choose: "Choose photos",
            zoneHint: "You can choose many photos at once.",
            limitHint: "Max 50 MB per file, 2 GB in total per visit.",
            nameLabel: "Your name (optional)",
            nameHint: "Helps us find your order.",
            nameEg: "e.g. Tasnim",
            phoneLabel: "Phone number (optional)",
            phoneHint: "Only if you want us to call.",
            phoneEg: "e.g. 01713 XXXXXX",
            send0: "Send photos",
            sendN: "Send {n} {photos}",
            sendRest: "Send the rest",
            sending: "Sending...",
            add: "Add more",
            remove: "Remove",
            retry: "Retry",
            ready: "Ready",
            sendingPct: "Sending {p}%",
            saving: "Saving",
            sent: "Sent",
            overallReady: "{n} {files} ready, {size}",
            overallProg: "{done} of {total} sent ({p}%)",
            progress: "Upload progress",
            skipped: "{n} {files} skipped (only photos and PDFs can be sent).",
            doneTitle: "{n} {photos} received",
            doneLede: "Our team will print them. You can close this page.",
            more: "Send more",
            review: "Review us on Google",
            reviewTitle: "Your satisfaction, our success—leave us a review",
            services: ["Passport Photo", "Visa Photo", "Photo Reprint", "Photo Album", "Photo Frame", "Mug Print"],
            e401: "Your 1 hour session ended. Reload this page to start again.",
            e413: "This file is larger than 50 MB.",
            e415: "Only photos and PDF files can be sent.",
            e507: "The lab computer is out of space. Please tell our staff.",
            eGeneric: "Could not send. Tap Retry.",
            eConn: "Connection lost. Tap Retry.",
            eStart:
              "Could not reach the lab computer. Check you are on our Wi-Fi.",
          },
        };

        let lang = "bn";
        try {
          const s = localStorage.getItem("fl_lang");
          if (s === "en" || s === "bn") lang = s;
        } catch (_) {}

        const bnDigits = (s) => s.replace(/[0-9]/g, (d) => "০১২৩৪৫৬৭৮৯"[d]);
        const t = (key, vars = {}) => {
          let s = T[lang][key] ?? key;
          if (lang === "en") {
            const n = vars.n;
            vars = {
              photos: n === 1 ? "photo" : "photos",
              files: n === 1 ? "file" : "files",
              ...vars,
            };
          }
          s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
          return lang === "bn" ? bnDigits(s) : s;
        };
        const fmt = (n) =>
          n < 1048576
            ? Math.max(1, Math.round(n / 1024)) + " KB"
            : (n / 1048576).toFixed(1) + " MB";
        const size = (n) => (lang === "bn" ? bnDigits(fmt(n)) : fmt(n));

        // ---- state ----
        let items = [];
        let started = false,
          busy = false,
          halted = false,
          sentBefore = 0,
          skippedCount = 0,
          alertKey = "",
          finished = false;

        const seen = new IntersectionObserver(
          (entries) => {
            for (const e of entries) {
              if (!e.isIntersecting) continue;
              seen.unobserve(e.target);
              const it = items.find((i) => i.li === e.target);
              if (it && it.file.type !== "application/pdf") {
                it.url = URL.createObjectURL(it.file);
                const img = document.createElement("img");
                img.alt = "";
                img.decoding = "async";
                img.onerror = () => {
                  img.remove();
                  it.thumb.textContent = ext(it.file.name);
                };
                img.src = it.url;
                it.thumb.textContent = "";
                it.thumb.append(img);
              }
            }
          },
          { rootMargin: "200px" },
        );

        const ext = (n) => (n.split(".").pop() || "").slice(0, 4);

        // ---- language ----
        function applyLang() {
          document.documentElement.lang = lang;
          document.title = t("brand");
          document.querySelectorAll("[data-i18n]").forEach((el) => {
            el.textContent = t(el.dataset.i18n);
          });
          document.querySelectorAll("[data-i18n-list]").forEach((el) => {
            el.replaceChildren(
              ...T[lang].services.map((x) => {
                const li = document.createElement("li");
                li.textContent = x;
                return li;
              }),
            );
          });
          document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
            el.placeholder = t(el.dataset.i18nPh);
          });
          document.querySelectorAll("[data-i18n-alt]").forEach((el) => {
            el.alt = t(el.dataset.i18nAlt);
          });
          document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
            el.setAttribute("aria-label", t(el.dataset.i18nAria));
          });
          $("langBtn").textContent = t("switchTo");
          $("langBtn").lang = lang === "bn" ? "en" : "bn"; // the label is in the other language
          refresh();
        }

        // ---- queue ----
        function addFiles(list) {
          let skipped = 0;
          for (const file of list) {
            const dupe = items.some(
              (i) =>
                i.file.name === file.name &&
                i.file.size === file.size &&
                i.file.lastModified === file.lastModified,
            );
            if (dupe) continue;
            if (!OK.test(file.name) || file.size === 0) {
              skipped++;
              continue;
            }
            const it = { file, state: "queued", loaded: 0 };
            if (file.size > MAX) {
              it.state = "error";
              it.err = "e413";
              it.fatal = true;
            }
            items.push(it);
            build(it);
          }
          skippedCount = skipped;
          alertKey = "";
          finished = false;
          refresh();
        }

        function build(it) {
          const li = document.createElement("li");
          li.className = "file";
          li.innerHTML =
            '<div class="thumb"></div><div class="meta"><div class="name"></div>' +
            '<div class="sub"><span class="size"></span><span class="status"></span></div>' +
            '<div class="bar"><i></i></div></div><div class="side"></div>';
          li.querySelector(".name").textContent = it.file.name;
          it.li = li;
          it.thumb = li.querySelector(".thumb");
          it.thumb.textContent = ext(it.file.name);
          it.size = li.querySelector(".size");
          it.bar = li.querySelector(".bar");
          it.status = li.querySelector(".status");
          it.side = li.querySelector(".side");
          $("list").append(li);
          seen.observe(li);
        }

        function paint(it) {
          it.li.dataset.state = it.state;
          const pct = Math.min(1, it.loaded / it.file.size);
          it.size.textContent = size(it.file.size);
          it.bar.style.setProperty("--p", it.state === "done" ? 1 : pct);
          it.status.textContent = {
            queued: t("ready"),
            uploading:
              pct >= 1
                ? t("saving")
                : t("sendingPct", { p: Math.round(pct * 100) }),
            done: t("sent"),
            error: t(it.err || "eGeneric"),
          }[it.state];
          it.side.textContent = "";
          if (it.state === "queued" && !busy)
            side(it, "remove", () => remove(it));
          if (it.state === "error" && !it.fatal && !busy && !halted)
            side(it, "retry", send);
          if (it.state === "error" && it.fatal && !busy)
            side(it, "remove", () => remove(it));
        }

        function side(it, key, fn) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "btn btn-ghost btn-small";
          b.textContent = t(key);
          b.onclick = fn;
          it.side.append(b);
        }

        function remove(it) {
          seen.unobserve(it.li);
          if (it.url) URL.revokeObjectURL(it.url);
          it.li.remove();
          items = items.filter((i) => i !== it);
          refresh();
        }

        function refresh() {
          const live = items.filter((i) => !i.fatal);
          const total = live.reduce((a, i) => a + i.file.size, 0);
          const loaded = live.reduce(
            (a, i) =>
              a +
              (i.state === "done"
                ? i.file.size
                : Math.min(i.loaded, i.file.size)),
            0,
          );
          const done = live.filter((i) => i.state === "done").length;
          const pending = live.filter(
            (i) => i.state === "queued" || i.state === "error",
          ).length;
          const pct = total ? loaded / total : 0;
          const has = items.length > 0;

          $("intro").hidden = has || finished;
          $("pick").hidden = has || finished;
          $("heroWrap").hidden = has || finished;
          $("queue").hidden = !has || finished;
          $("done").hidden = !finished;
          $("details").hidden = started || finished; // name and phone stay editable until the first send
          $("overallBar").firstElementChild.style.setProperty("--p", pct);
          $("overallBar").setAttribute("aria-valuenow", Math.round(pct * 100));
          $("overallText").textContent =
            busy || done
              ? t("overallProg", {
                  done,
                  total: live.length,
                  p: Math.round(pct * 100),
                })
              : t("overallReady", { n: live.length, size: size(total) });
          const s = $("send");
          s.disabled = busy || halted || pending === 0;
          s.textContent = busy
            ? t("sending")
            : pending
              ? done
                ? t("sendRest")
                : t("sendN", { n: pending })
              : t("send0");
          $("add").disabled = busy;
          $("skipped").hidden = !skippedCount;
          $("skipped").textContent = skippedCount
            ? t("skipped", { n: skippedCount })
            : "";
          $("alert").hidden = !alertKey;
          $("alert").textContent = alertKey ? t(alertKey) : "";
          if (finished)
            $("doneTitle").textContent = t("doneTitle", { n: sentBefore });
          items.forEach(paint);
        }

        function upload(it) {
          return new Promise((resolve) => {
            const x = new XMLHttpRequest();
            it.state = "uploading";
            it.loaded = 0;
            it.err = "";
            x.open("POST", "/drop/upload");
            x.upload.onprogress = (e) => {
              it.loaded = e.loaded;
              refresh();
            };
            x.onload = () => {
              if (x.status === 200) {
                it.state = "done";
              } else {
                it.state = "error";
                it.err =
                  { 401: "e401", 413: "e413", 415: "e415", 507: "e507" }[
                    x.status
                  ] || "eGeneric";
                if (x.status === 401) {
                  halted = true;
                  alertKey = "e401";
                }
                if (x.status === 415 || x.status === 413) it.fatal = true;
              }
              resolve();
            };
            x.onerror = () => {
              it.state = "error";
              it.err = "eConn";
              resolve();
            };
            const fd = new FormData();
            fd.append("file", it.file, it.file.name);
            x.send(fd);
          });
        }

        async function send() {
          if (busy || halted) return;
          busy = true;
          alertKey = "";
          refresh();
          try {
            if (!started) {
              const r = await fetch("/drop/start", {
                method: "POST",
                body: new URLSearchParams({
                  name: $("name").value,
                  phone: $("phone").value,
                }),
              });
              if (!r.ok) throw new Error("start");
              started = true;
            }
            const todo = items.filter(
              (i) => !i.fatal && (i.state === "queued" || i.state === "error"),
            );
            let k = 0;
            const worker = async () => {
              while (k < todo.length && !halted) await upload(todo[k++]);
            };
            await Promise.all([worker(), worker(), worker()]);
          } catch (_) {
            alertKey = "eStart";
          }
          busy = false;
          const live = items.filter((i) => !i.fatal);
          if (live.length && live.every((i) => i.state === "done")) {
            sentBefore += live.length;
            finished = true;
          }
          refresh();
        }

        function reset() {
          for (const it of items) {
            seen.unobserve(it.li);
            if (it.url) URL.revokeObjectURL(it.url);
          }
          items = [];
          $("list").textContent = "";
          skippedCount = 0;
          finished = false;
          refresh();
        }

        $("langBtn").onclick = () => {
          lang = lang === "bn" ? "en" : "bn";
          try {
            localStorage.setItem("fl_lang", lang);
          } catch (_) {}
          applyLang();
        };
        $("choose").onclick = $("add").onclick = () => $("file").click();
        $("file").onchange = (e) => {
          addFiles(Array.from(e.target.files));
          e.target.value = "";
        };
        $("send").onclick = send;
        $("more").onclick = () => {
          reset();
          $("file").click();
        };
        window.addEventListener("beforeunload", (e) => {
          if (busy) {
            e.preventDefault();
            e.returnValue = "";
          }
        });
        applyLang();
      })();
    </script>
